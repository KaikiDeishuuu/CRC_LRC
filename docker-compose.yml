version: "3.8"

services:
  checksum-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checksum-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 如果需要持久化配置，可以挂载配置文件
      - ./config/config.yaml:/app/config/config.yaml:ro
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge
